<text x="1040.00" y="386.00" dominant-baseline="hanging" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#20343D">验证结果</text>
<text x="1005.50" y="443.00" dominant-baseline="hanging" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#5E7077">用证据检查实际行为</text>
<text x="1000.00" y="498.00" dominant-baseline="hanging" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#4E7396">AI：检查与辅助检视</text>
<text x="1000.00" y="546.00" dominant-baseline="hanging" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#087F78">人：验收与风险判断</text>
<polyline points="1228,404 1269,404" fill="none" stroke="#087F78" stroke-width="4" stroke-linejoin="round"/>
