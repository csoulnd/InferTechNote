<text x="116.00" y="443.00" dominant-baseline="hanging" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#5E7077">先定义什么算完成</text>
<text x="100.00" y="498.00" dominant-baseline="hanging" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#4E7396">AI：澄清与核查</text>
<text x="100.00" y="546.00" dominant-baseline="hanging" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#087F78">人：目标与约束</text>
