<text x="72.00" y="121.00" dominant-baseline="hanging" font-family="Microsoft YaHei, sans-serif" font-size="50" font-weight="700" fill="#20343D">一次任务的交付闭环</text>
<text x="75.00" y="195.00" dominant-baseline="hanging" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#5E7077">人明确目标、判断边界并验收；AI 承担查阅、实现和执行检查。</text>
