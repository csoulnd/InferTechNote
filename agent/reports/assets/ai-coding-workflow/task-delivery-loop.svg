<polyline points="1400,590 1400,819 200,819 200,601" fill="none" stroke="#087F78" stroke-width="4" stroke-linejoin="round"/>
<polygon points="200.00,601.00 193.00,616.00 207.00,616.00" fill="#087F78"/>
<rect x="260" y="796" width="1060" height="54" rx="0" fill="#F5F3EC"/>
<text x="473.50" y="810.00" dominant-baseline="hanging" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#087F78">交付后沉淀约定、验证步骤与 skill，供下一次任务复用</text>
<text x="75.00" y="930.00" dominant-baseline="hanging" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#5E7077">计划、执行、验证、交付都要完成；展开深度随任务的不确定性与影响调整。</text>
